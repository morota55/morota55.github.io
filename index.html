<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>URL情報取得ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>参考文献形式 出力ツール</h1>
        <textarea id="urlInput" placeholder="URLを入力してください（複数の場合は改行で区切ってください）" rows="5"></textarea>
        <button onclick="fetchWebInfo()">情報取得</button>
        <button onclick="copyToClipboard()">コピー</button>
        <p id="message"></p>
        <textarea id="result" readonly></textarea>
    </div>
    <script src="script.js"></script>
</body>
</html>
